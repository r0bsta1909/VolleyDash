# =============================================================================
# CI fuer Volley Dash (M1-11, `12_OPENSOURCE_REPO_SETUP` §5)
#
#   Push und Pull Request  -> Tests unter echtem LuaJIT
#   Tag v*                 -> Vollbuild Windows + macOS, an den Release gehaengt
#
# Die Build-Jobs haengen seit M4-09 an `test` UND `protocol`. Vorher konnte ein
# roter Protokolllauf ein Release nicht aufhalten; mit den Socket-Selbsttests im
# selben Job waere das die falsche Reihenfolge -- ein Paket, dessen Netzweg
# nachweislich nicht funktioniert, soll gar nicht erst entstehen.
#
# Der Testlauf ist der Ort, an dem sich `tests/run_headless.lua` zum ersten Mal
# an einem echten Lua-Interpreter beweist: auf der Entwicklungsmaschine gibt es
# keinen, dort laeuft der Pfad nur unter LOEVE (`love . --test`).
#
# Seit M4-09 laufen dazu die beiden SELBSTTESTS ueber echte Sockets mit
# (`--net-selftest`, `--tournament-selftest`). Vorher pruefte die CI nur, was
# ohne Leitung entscheidbar ist -- und bei einem Turnier mit verteilten
# Match-Hosts ist das die kleinere Haelfte.
# =============================================================================
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LOVE_VERSION: '11.5'

jobs:
  test:
    name: Tests (Ebene A + B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: LuaJIT installieren
        run: sudo apt-get update && sudo apt-get install -y luajit

      # Ohne LOEVE, ohne Fenster, ohne Grafikkarte. Wenn das hier scheitert,
      # ist entweder ein Test kaputt oder die love-Freiheit verletzt.
      - name: Headless-Tests
        run: luajit tests/run_headless.lua

      - name: Referenz-Rallyes pruefen
        run: python3 tools/verify_replays.py

  # ---------------------------------------------------------------------------
  # Protokoll UND Sockets auf beiden Zielplattformen (M2-01, M2-10, M4-09)
  #
  # Drei Schritte, drei verschiedene Fragen: das Nachrichtenformat (T-N-07),
  # der Netzweg eines Matches (T-N-08, T-N-10) und der Turnierbetrieb mit vier
  # parallelen Matches (T-N-11, T-N-09). Die letzten beiden laufen ueber echte
  # Sockets und sind seit M4-09 dabei -- vorher pruefte die CI nur, was auf
  # dem Papier steht.
  #
  # `src/net/protocol.lua` serialisiert mit `love.data.pack` und laeuft deshalb
  # nicht im LuaJIT-Lauf oben. Genau diese Suite beantwortet aber den offenen
  # Punkt N-03 aus `04_NETCODE_SPEC` §13: schreiben Windows-x86-64 und
  # macOS-ARM64 dieselben Bytes? Die Referenz steht in tests/protocol_test.lua;
  # laeuft der Fall hier auf beiden Laeufern durch, ist die Frage beantwortet.
  #
  # `love . --test` kommt seit M2-01 ohne Fenster aus (conf.lua), sonst waere
  # der Lauf auf einem Laeufer ohne Bildschirm nicht moeglich.
  # ---------------------------------------------------------------------------
  protocol:
    name: Protokoll und Sockets (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: LOEVE laden (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o love.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip"
          unzip -q love.zip
          echo "LOVE_BIN=$PWD/love-${LOVE_VERSION}-win64/lovec.exe" >> "$GITHUB_ENV"

      - name: LOEVE laden (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o love.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-macos.zip"
          unzip -q love.zip
          echo "LOVE_BIN=$PWD/love.app/Contents/MacOS/love" >> "$GITHUB_ENV"

      # Die Ausgabe wandert bei einem Fehlschlag in eine Annotation. Grund:
      # Job-Logs lassen sich ueber die API nur mit Admin-Rechten abrufen,
      # Annotationen von jedem. Wer den Fehler sucht, soll ihn sehen, ohne
      # sich anmelden zu muessen.
      - name: Tests inklusive Protokoll
        timeout-minutes: 5
        shell: bash
        run: |
          set +e
          # `tee` statt `>`: Bei einer Zeitschranke bricht der Laeufer den
          # Schritt MITTEN im Lauf ab, und ein nachgelagertes `cat` kommt dann
          # nie dran. Genau so ist Lauf 35 ausgegangen -- drei Minuten, null
          # Zeilen. Mit `tee` steht alles schon im Joblog, waehrend es passiert.
          "$LOVE_BIN" . --test 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ] || [ ! -s test.log ]; then
            printf '::error title=%s::' "Protokolltest ${{ matrix.os }} (Code $code)"
            grep -E '^  FAIL|bestanden' test.log | tail -30 | while IFS= read -r line; do
              printf '%s%%0A' "$line"
            done
            echo
          fi
          exit $code

      # -----------------------------------------------------------------------
      # Die beiden Selbsttests ueber echte Sockets (M2-10, M4-09)
      #
      # `--test` prueft Regeln, Bracket und Nachrichtenformat. Was es NICHT
      # anfasst, ist der Weg ueber die Leitung -- und genau der ist bei M4-09
      # die interessantere Haelfte: Handschlag, Discovery, Eingabefluss,
      # Snapshotweg (T-N-08, T-N-10) und die vier parallelen Turniermatches mit
      # gleichzeitigem Ergebnisversand (T-N-11) samt drei gleichzeitigen
      # Turnieren im selben Netz (T-N-09).
      #
      # Beide binden ausschliesslich Loopback und eigene Ports (21292/21293
      # bzw. 21294/21295), damit sie weder einander noch eine laufende Partie
      # stoeren. Sie brauchen kein Fenster.
      #
      # WAS DIESER SCHRITT NICHT BEANTWORTET: N-04 und N-05. Ein Laeufer hat
      # keine Firewall und keine zweite Maschine; dass ENet hier eine
      # eingehende Verbindung annimmt, sagt ueber einen fremden Mac nichts.
      # Seit M4-09 haengt daran mehr als vorher, weil ein Match-Wirt einen
      # EPHEMEREN Port oeffnet und nicht mehr nur 21212 freizugeben ist
      # (`05_TOURNAMENT` §8.2). Das bleibt Abnahme D2 auf zwei Rechnern.
      #
      # Beide Schritte sind ZEITBESCHRAENKT. Lokal laufen sie in unter zwanzig
      # Sekunden; was laenger braucht, haengt und soll das melden, statt bis
      # zum Sechs-Stunden-Limit des Laeufers zu stehen. Gemessen an Lauf 34
      # (2026-08-13), der auf `windows-latest` genau das getan hat.
      #
      # Sollte einer der beiden sporadisch scheitern, ist die erste Frage, ob
      # ein Port belegt war -- dann meldet er "laesst sich nicht binden" und
      # nicht ein stilles Fehlergebnis.
      # -----------------------------------------------------------------------
      - name: Netz-Selbsttest
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          # `tee` statt `>`: Bei einer Zeitschranke bricht der Laeufer den
          # Schritt MITTEN im Lauf ab, und ein nachgelagertes `cat` kommt dann
          # nie dran. Genau so ist Lauf 35 ausgegangen -- drei Minuten, null
          # Zeilen. Mit `tee` steht alles schon im Joblog, waehrend es passiert.
          "$LOVE_BIN" . --net-selftest 2>&1 | tee net.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ] || [ ! -s net.log ]; then
            printf '::error title=%s::' "Netz-Selbsttest ${{ matrix.os }} (Code $code)"
            grep -E '^  FAIL|^\[net\]' net.log | tail -30 | while IFS= read -r line; do
              printf '%s%%0A' "$line"
            done
            echo
          fi
          exit $code

      - name: Turnier-Selbsttest
        timeout-minutes: 3
        shell: bash
        run: |
          set +e
          # `tee` statt `>`: Bei einer Zeitschranke bricht der Laeufer den
          # Schritt MITTEN im Lauf ab, und ein nachgelagertes `cat` kommt dann
          # nie dran. Genau so ist Lauf 35 ausgegangen -- drei Minuten, null
          # Zeilen. Mit `tee` steht alles schon im Joblog, waehrend es passiert.
          "$LOVE_BIN" . --tournament-selftest 2>&1 | tee tournament.log
          code=${PIPESTATUS[0]}
          if [ $code -ne 0 ] || [ ! -s tournament.log ]; then
            printf '::error title=%s::' "Turnier-Selbsttest ${{ matrix.os }} (Code $code)"
            grep -E '^  FAIL|^\[turnier\]' tournament.log | tail -30 | while IFS= read -r line; do
              printf '%s%%0A' "$line"
            done
            echo
          fi
          exit $code

  love:
    name: .love bauen
    runs-on: ubuntu-latest
    needs: [test, protocol]
    steps:
      - uses: actions/checkout@v5

      - name: .love bauen
        run: bash tools/build.sh love

      - uses: actions/upload-artifact@v7
        with:
          name: love-package
          path: build/VolleyDash.love
          retention-days: 14

  windows:
    name: Windows-Paket
    runs-on: ubuntu-latest
    needs: [test, protocol]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      # Kein Windows-Runner noetig: die Fusion ist ein `cat` (06_BUILD §3).
      - name: LOEVE fuer Windows laden
        run: |
          mkdir -p tools/prebuilt
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/love-win64.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip"
          unzip -q /tmp/love-win64.zip -d tools/prebuilt
          mv "tools/prebuilt/love-${LOVE_VERSION}-win64" tools/prebuilt/love-win64
          test -f tools/prebuilt/love-win64/license.txt

      - name: Bauen
        env:
          LOVE_WIN: tools/prebuilt/love-win64
        run: bash tools/build.sh win

      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: build/*-win64.zip

  macos:
    name: macOS-Paket
    runs-on: macos-latest      # Pflicht: codesign gibt es nur hier
    needs: [test, protocol]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: LOEVE fuer macOS laden
        run: |
          mkdir -p tools/prebuilt
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/love-macos.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-macos.zip"
          # -q laesst Symlinks in den Frameworks unangetastet
          unzip -q /tmp/love-macos.zip -d tools/prebuilt/love-macos
          test -d tools/prebuilt/love-macos/love.app

      # Die Ad-hoc-Signatur braucht weder Secret noch Apple-Konto. Der
      # codesign-Verify in build.sh ist Abbruchbedingung (ADR-012): ein Release
      # mit kaputter Signatur startet auf keinem Apple-Silicon-Mac, und das
      # wuerde sonst erst der erste Nutzer merken.
      - name: Bauen und ad-hoc signieren
        env:
          LOVE_MAC: tools/prebuilt/love-macos
        run: bash tools/build.sh mac

      - name: Signatur unabhaengig nachpruefen
        run: |
          app=$(find build -name '*.app' -maxdepth 2 | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app" || \
            echo "spctl meldet 'rejected' -- erwartet ohne Notarisierung (ADR-012)"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: build/*-macos.zip

  release:
    name: Release bestuecken
    runs-on: ubuntu-latest
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Mit der auf dem Runner vorinstallierten gh-CLI statt einer fremden
      # Action: `CLAUDE.md` §7 haelt Abhaengigkeiten knapp, und das gilt auch
      # fuer die Bauumgebung.
      #
      # Der Release entsteht als ENTWURF. Das ist Absicht: Schritt 7 in
      # `12_OPENSOURCE` §7 ist ein Start auf einem FREMDEN Rechner, nicht ein
      # gruener Haken in der CI. Veroeffentlicht wird von Hand.
      # Der Text kommt aus dem CHANGELOG und den beiden Startanleitungen
      # (`12_OPENSOURCE` §7.6), nicht aus `--generate-notes`: eine Liste
      # englischer Commit-Titel hilft niemandem, der nur spielen will.
      - name: Entwurf anlegen und Pakete anhaengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          bash tools/release_notes.sh "${tag#v}" > notes.md
          gh release create "$tag" \
            --draft \
            --title "Volley Dash $tag" \
            --notes-file notes.md \
            $(find artifacts -name '*.zip')
