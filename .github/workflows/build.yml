# =============================================================================
# CI fuer Volley Dash (M1-11, `12_OPENSOURCE_REPO_SETUP` §5)
#
#   Push und Pull Request  -> Tests unter echtem LuaJIT
#   Tag v*                 -> Vollbuild Windows + macOS, an den Release gehaengt
#
# Der Testlauf ist der Ort, an dem sich `tests/run_headless.lua` zum ersten Mal
# an einem echten Lua-Interpreter beweist: auf der Entwicklungsmaschine gibt es
# keinen, dort laeuft der Pfad nur unter LOEVE (`love . --test`).
# =============================================================================
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LOVE_VERSION: '11.5'

jobs:
  test:
    name: Tests (Ebene A + B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: LuaJIT installieren
        run: sudo apt-get update && sudo apt-get install -y luajit

      # Ohne LOEVE, ohne Fenster, ohne Grafikkarte. Wenn das hier scheitert,
      # ist entweder ein Test kaputt oder die love-Freiheit verletzt.
      - name: Headless-Tests
        run: luajit tests/run_headless.lua

      - name: Referenz-Rallyes pruefen
        run: python3 tools/verify_replays.py

  love:
    name: .love bauen
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: .love bauen
        run: bash tools/build.sh love

      - uses: actions/upload-artifact@v4
        with:
          name: love-package
          path: build/VolleyDash.love
          retention-days: 14

  windows:
    name: Windows-Paket
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      # Kein Windows-Runner noetig: die Fusion ist ein `cat` (06_BUILD §3).
      - name: LOEVE fuer Windows laden
        run: |
          mkdir -p tools/prebuilt
          curl -fsSL -o /tmp/love-win64.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip"
          unzip -q /tmp/love-win64.zip -d tools/prebuilt
          mv "tools/prebuilt/love-${LOVE_VERSION}-win64" tools/prebuilt/love-win64
          test -f tools/prebuilt/love-win64/license.txt

      - name: Bauen
        env:
          LOVE_WIN: tools/prebuilt/love-win64
        run: bash tools/build.sh win

      - uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: build/*-win64.zip

  macos:
    name: macOS-Paket
    runs-on: macos-latest      # Pflicht: codesign gibt es nur hier
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: LOEVE fuer macOS laden
        run: |
          mkdir -p tools/prebuilt
          curl -fsSL -o /tmp/love-macos.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-macos.zip"
          # -q laesst Symlinks in den Frameworks unangetastet
          unzip -q /tmp/love-macos.zip -d tools/prebuilt/love-macos
          test -d tools/prebuilt/love-macos/love.app

      # Die Ad-hoc-Signatur braucht weder Secret noch Apple-Konto. Der
      # codesign-Verify in build.sh ist Abbruchbedingung (ADR-012): ein Release
      # mit kaputter Signatur startet auf keinem Apple-Silicon-Mac, und das
      # wuerde sonst erst der erste Nutzer merken.
      - name: Bauen und ad-hoc signieren
        env:
          LOVE_MAC: tools/prebuilt/love-macos
        run: bash tools/build.sh mac

      - name: Signatur unabhaengig nachpruefen
        run: |
          app=$(find build -name '*.app' -maxdepth 2 | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app" || \
            echo "spctl meldet 'rejected' -- erwartet ohne Notarisierung (ADR-012)"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: build/*-macos.zip

  release:
    name: Release bestuecken
    runs-on: ubuntu-latest
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Mit der auf dem Runner vorinstallierten gh-CLI statt einer fremden
      # Action: `CLAUDE.md` §7 haelt Abhaengigkeiten knapp, und das gilt auch
      # fuer die Bauumgebung.
      #
      # Der Release entsteht als ENTWURF. Das ist Absicht: Schritt 7 in
      # `12_OPENSOURCE` §7 ist ein Start auf einem FREMDEN Rechner, nicht ein
      # gruener Haken in der CI. Veroeffentlicht wird von Hand.
      - name: Entwurf anlegen und Pakete anhaengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            --draft \
            --title "Volley Dash $tag" \
            --generate-notes \
            $(find artifacts -name '*.zip')
