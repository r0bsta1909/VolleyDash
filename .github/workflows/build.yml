# =============================================================================
# CI fuer Volley Dash (M1-11, `12_OPENSOURCE_REPO_SETUP` §5)
#
#   Push und Pull Request  -> Tests unter echtem LuaJIT
#   Tag v*                 -> Vollbuild Windows + macOS, an den Release gehaengt
#
# Der Testlauf ist der Ort, an dem sich `tests/run_headless.lua` zum ersten Mal
# an einem echten Lua-Interpreter beweist: auf der Entwicklungsmaschine gibt es
# keinen, dort laeuft der Pfad nur unter LOEVE (`love . --test`).
# =============================================================================
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LOVE_VERSION: '11.5'

jobs:
  test:
    name: Tests (Ebene A + B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: LuaJIT installieren
        run: sudo apt-get update && sudo apt-get install -y luajit

      # Ohne LOEVE, ohne Fenster, ohne Grafikkarte. Wenn das hier scheitert,
      # ist entweder ein Test kaputt oder die love-Freiheit verletzt.
      - name: Headless-Tests
        run: luajit tests/run_headless.lua

      - name: Referenz-Rallyes pruefen
        run: python3 tools/verify_replays.py

  # ---------------------------------------------------------------------------
  # Protokolltests auf beiden Zielplattformen (M2-01, Testfall T-N-07)
  #
  # `src/net/protocol.lua` serialisiert mit `love.data.pack` und laeuft deshalb
  # nicht im LuaJIT-Lauf oben. Genau diese Suite beantwortet aber den offenen
  # Punkt N-03 aus `04_NETCODE_SPEC` §13: schreiben Windows-x86-64 und
  # macOS-ARM64 dieselben Bytes? Die Referenz steht in tests/protocol_test.lua;
  # laeuft der Fall hier auf beiden Laeufern durch, ist die Frage beantwortet.
  #
  # `love . --test` kommt seit M2-01 ohne Fenster aus (conf.lua), sonst waere
  # der Lauf auf einem Laeufer ohne Bildschirm nicht moeglich.
  # ---------------------------------------------------------------------------
  protocol:
    name: Protokoll-Bytes (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: LOEVE laden (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -fsSL -o love.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip"
          unzip -q love.zip
          echo "LOVE_BIN=$PWD/love-${LOVE_VERSION}-win64/lovec.exe" >> "$GITHUB_ENV"

      - name: LOEVE laden (macOS)
        if: runner.os == 'macOS'
        run: |
          curl -fsSL -o love.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-macos.zip"
          unzip -q love.zip
          echo "LOVE_BIN=$PWD/love.app/Contents/MacOS/love" >> "$GITHUB_ENV"

      # Die Ausgabe wandert bei einem Fehlschlag in eine Annotation. Grund:
      # Job-Logs lassen sich ueber die API nur mit Admin-Rechten abrufen,
      # Annotationen von jedem. Wer den Fehler sucht, soll ihn sehen, ohne
      # sich anmelden zu muessen.
      - name: Tests inklusive Protokoll
        shell: bash
        run: |
          set +e
          "$LOVE_BIN" . --test > test.log 2>&1
          code=$?
          cat test.log
          if [ $code -ne 0 ] || [ ! -s test.log ]; then
            printf '::error title=%s::' "Protokolltest ${{ matrix.os }} (Code $code)"
            tail -30 test.log | while IFS= read -r line; do printf '%s%%0A' "$line"; done
            printf '\n'
          fi
          exit $code

  love:
    name: .love bauen
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: .love bauen
        run: bash tools/build.sh love

      - uses: actions/upload-artifact@v7
        with:
          name: love-package
          path: build/VolleyDash.love
          retention-days: 14

  windows:
    name: Windows-Paket
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      # Kein Windows-Runner noetig: die Fusion ist ein `cat` (06_BUILD §3).
      - name: LOEVE fuer Windows laden
        run: |
          mkdir -p tools/prebuilt
          curl -fsSL -o /tmp/love-win64.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-win64.zip"
          unzip -q /tmp/love-win64.zip -d tools/prebuilt
          mv "tools/prebuilt/love-${LOVE_VERSION}-win64" tools/prebuilt/love-win64
          test -f tools/prebuilt/love-win64/license.txt

      - name: Bauen
        env:
          LOVE_WIN: tools/prebuilt/love-win64
        run: bash tools/build.sh win

      - uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: build/*-win64.zip

  macos:
    name: macOS-Paket
    runs-on: macos-latest      # Pflicht: codesign gibt es nur hier
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5

      - name: LOEVE fuer macOS laden
        run: |
          mkdir -p tools/prebuilt
          curl -fsSL -o /tmp/love-macos.zip \
            "https://github.com/love2d/love/releases/download/${LOVE_VERSION}/love-${LOVE_VERSION}-macos.zip"
          # -q laesst Symlinks in den Frameworks unangetastet
          unzip -q /tmp/love-macos.zip -d tools/prebuilt/love-macos
          test -d tools/prebuilt/love-macos/love.app

      # Die Ad-hoc-Signatur braucht weder Secret noch Apple-Konto. Der
      # codesign-Verify in build.sh ist Abbruchbedingung (ADR-012): ein Release
      # mit kaputter Signatur startet auf keinem Apple-Silicon-Mac, und das
      # wuerde sonst erst der erste Nutzer merken.
      - name: Bauen und ad-hoc signieren
        env:
          LOVE_MAC: tools/prebuilt/love-macos
        run: bash tools/build.sh mac

      - name: Signatur unabhaengig nachpruefen
        run: |
          app=$(find build -name '*.app' -maxdepth 2 | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose "$app" || \
            echo "spctl meldet 'rejected' -- erwartet ohne Notarisierung (ADR-012)"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-package
          path: build/*-macos.zip

  release:
    name: Release bestuecken
    runs-on: ubuntu-latest
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Mit der auf dem Runner vorinstallierten gh-CLI statt einer fremden
      # Action: `CLAUDE.md` §7 haelt Abhaengigkeiten knapp, und das gilt auch
      # fuer die Bauumgebung.
      #
      # Der Release entsteht als ENTWURF. Das ist Absicht: Schritt 7 in
      # `12_OPENSOURCE` §7 ist ein Start auf einem FREMDEN Rechner, nicht ein
      # gruener Haken in der CI. Veroeffentlicht wird von Hand.
      # Der Text kommt aus dem CHANGELOG und den beiden Startanleitungen
      # (`12_OPENSOURCE` §7.6), nicht aus `--generate-notes`: eine Liste
      # englischer Commit-Titel hilft niemandem, der nur spielen will.
      - name: Entwurf anlegen und Pakete anhaengen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          bash tools/release_notes.sh "${tag#v}" > notes.md
          gh release create "$tag" \
            --draft \
            --title "Volley Dash $tag" \
            --notes-file notes.md \
            $(find artifacts -name '*.zip')
